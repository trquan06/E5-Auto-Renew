services:
  webui:
    build:
      context: https://github.com/trquan06/E5-Auto-Renew.git#main
    image: e5-auto-renew:portainer
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      DEFAULT_TIMEZONE: UTC
      PUBLIC_BASE_URL: ""
      FORWARDED_ALLOW_IPS: 127.0.0.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - e5_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  e5_data:

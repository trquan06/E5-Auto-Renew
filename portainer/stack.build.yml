services:
  webui:
    build:
      context: https://github.com/OWNER/ms365-auto-renew.git#main
    image: ms365-auto-renew:portainer
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      DEFAULT_TIMEZONE: UTC
      PUBLIC_BASE_URL: https://ms365.example.com
    ports:
      - "8080:8080"
    volumes:
      - ms365_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  ms365_data:
